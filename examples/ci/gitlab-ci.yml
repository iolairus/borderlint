# Copy into a consuming repo's .gitlab-ci.yml.
# Replace residency.json and customer-pii with the repository's policy and data class.
borderlint:
  image: python:3.12-slim
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - python -m pip install --no-cache-dir borderlint
  script:
    - borderlint scan . --policy residency.json --classification customer-pii
