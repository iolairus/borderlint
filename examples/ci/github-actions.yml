# Copy this file to .github/workflows/borderlint.yml in your repository.
name: AI data residency
on: [push, pull_request]
jobs:
  borderlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: iolairus/borderlint@v1.19.3
        with:
          path: .
          policy: residency.json
          classification: customer-pii
